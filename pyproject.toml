[project]
name = "eleicoes"
version = "0.1.0"
description = "Desvios atípicos entre 1º e 2º turno — Presidente, Brasil 2026"
requires-python = ">=3.13"
dependencies = [
    "polars>=2.1",
    "cryptography>=46",
    "numpy>=2",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
