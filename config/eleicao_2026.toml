# Parâmetros da coleta. Códigos de eleição e pleito NÃO ficam aqui:
# são descobertos em comum/config/ele-c.json a cada execução (ver tse.descobrir_eleicao).

ano = 2026
cargo = 1                       # Presidente
base_url = "https://resultados.tse.jus.br/oficial"

# Regra de consumo do TSE: máx. 100 req/s por IP, bloqueio de 10 min (renovável).
